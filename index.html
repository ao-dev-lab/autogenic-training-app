<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#123045">
<title>自律訓練法ガイド</title>
<style>
  :root {
    --bg: #0f2436;
    --bg-2: #123045;
    --card: #16374f;
    --text: #eaf4fb;
    --muted: #9fc0d6;
    --accent: #4fb0c6;
    --accent-2: #3d8ea0;
    --danger: #c96a5a;
    --danger-2: #a9543f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    height: 100%;
  }
  body {
    min-height: 100vh;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    text-align: center;
    margin: 20px 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    margin-bottom: 18px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .section-label {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 10px;
    letter-spacing: 0.05em;
  }
  .course-row {
    display: flex;
    gap: 10px;
  }
  .course-btn {
    flex: 1;
    padding: 16px 0;
    font-size: 1.1rem;
    font-weight: 600;
    border-radius: 14px;
    border: 2px solid var(--accent-2);
    background: transparent;
    color: var(--text);
  }
  .course-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #05262f;
  }
  .course-btn:disabled {
    opacity: 0.5;
  }
  .status-card {
    text-align: center;
    padding: 28px 20px;
  }
  .phase-label {
    font-size: 1rem;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.1em;
    min-height: 1.4em;
  }
  .phrase-text {
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1.5;
    margin: 14px 0;
    min-height: 3.2em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .time-display {
    font-size: 2rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
  }
  .time-target {
    font-size: 0.9rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .controls {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .big-btn {
    width: 100%;
    padding: 26px 0;
    font-size: 1.5rem;
    font-weight: 700;
    border-radius: 20px;
    border: none;
    color: #fff;
    background: var(--accent-2);
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
  }
  .big-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.25);
  }
  .big-btn.start { background: var(--accent-2); }
  .big-btn.toggle { background: #3d6b8e; }
  .big-btn.end { background: var(--danger-2); }
  .big-btn:disabled {
    opacity: 0.4;
    box-shadow: none;
  }
  .hint {
    max-width: 480px;
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
    margin: 18px 0 6px;
    line-height: 1.6;
  }
  .warn {
    max-width: 480px;
    background: #4a2d2d;
    color: #f5c8bd;
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 0.85rem;
    text-align: center;
    margin-bottom: 14px;
    display: none;
  }
</style>
</head>
<body>

  <h1>自律訓練法ガイド</h1>
  <div class="subtitle">日本語音声で、ゆっくり誘導します</div>

  <div id="warn" class="warn">
    このブラウザは音声読み上げ(音声合成)に対応していないようです。iPhoneのSafariでお試しください。
  </div>

  <div class="card">
    <div class="section-label">コースを選ぶ</div>
    <div class="course-row">
      <button class="course-btn" data-min="5">5分</button>
      <button class="course-btn active" data-min="10">10分</button>
      <button class="course-btn" data-min="15">15分</button>
    </div>
  </div>

  <div class="card status-card">
    <div class="phase-label" id="phaseLabel">準備ができたら「開始」を押してください</div>
    <div class="phrase-text" id="phraseText">&nbsp;</div>
    <div class="time-display" id="timeDisplay">00:00</div>
    <div class="time-target" id="timeTarget">目安: 10分</div>
  </div>

  <div class="controls">
    <button class="big-btn start" id="startBtn">開始</button>
    <button class="big-btn toggle" id="toggleBtn" disabled>一時停止</button>
    <button class="big-btn end" id="endBtn" disabled>終了</button>
  </div>

  <div class="hint">
    イヤホンでもスピーカーでも聞けます。画面を見なくても、下の3つの大きなボタンだけで操作できます。<br>
    サイレント(マナー)モードがオンだと音が出ない場合があります。iPhone横のスイッチをご確認ください。
  </div>

<script>
(function () {
  "use strict";

  var synth = window.speechSynthesis;
  if (!synth) {
    document.getElementById('warn').style.display = 'block';
  }

  // iPhone/Safariの日本語音声の中から、できるだけ柔らかく落ち着いた声を選ぶ
  var selectedVoice = null;
  function pickJapaneseVoice() {
    if (!synth) return;
    var voices = synth.getVoices().filter(function (v) {
      return v.lang && v.lang.toLowerCase().indexOf('ja') === 0;
    });
    if (!voices.length) { selectedVoice = null; return; }
    function score(v) {
      var name = (v.name + ' ' + v.voiceURI).toLowerCase();
      var s = 0;
      if (name.indexOf('premium') > -1) s += 4;   // 高品質(なめらか)な声を優先
      if (name.indexOf('enhanced') > -1) s += 4;
      if (name.indexOf('siri') > -1) s += 2;
      if (name.indexOf('kyoko') > -1) s += 1;     // 標準搭載の柔らかめの声
      if (name.indexOf('o-ren') > -1) s += 1;
      if (name.indexOf('female') > -1) s += 1;
      return s;
    }
    voices.sort(function (a, b) { return score(b) - score(a); });
    selectedVoice = voices[0];
  }
  if (synth) {
    pickJapaneseVoice();
    synth.onvoiceschanged = pickJapaneseVoice;
  }

  // 自律訓練法向けに、低め・ゆっくりめに調整した声のプロファイル
  var VOICE_BASE = { rate: 0.80, pitch: 0.92 };     // 準備・呼吸・消去動作のナレーション
  var VOICE_FEELING = { rate: 0.68, pitch: 0.84 };  // 「重い」「温かい」の言葉かけ(より低く、ゆっくり)

  // ---- 台本(スクリプト)データ ----
  // text: 画面表示。speak: 読み上げる文字列(省略時はtextを読み上げる)。
  // silence: そのセリフを話し終えてから、次に進むまでの沈黙(秒)。
  var HAND_R = { display: '右手', speech: '右手' };
  var HAND_L = { display: '左手', speech: '左手' };
  var FOOT_R = { display: '右足', speech: 'みぎあし' };   // 「足」は必ず「あし」と読ませる
  var FOOT_L = { display: '左足', speech: 'ひだりあし' };
  var HAND_FOOT_BOTH = { display: '両手・両足', speech: '両手、りょうあし' };

  var HEAVY = { display: 'おも〜い', speech: 'おもーい' };
  var WARM = { display: 'あたたか〜い', speech: 'あたたかーい' };

  // 「右手が……おもーい……」(間)「右手が……おもーい……」のように、
  // 主語と言葉かけの間、そして繰り返しの間に、十分な沈黙を入れる
  function feelingCue(phase, subject, feeling, opts) {
    opts = opts || {};
    var inner = opts.inner != null ? opts.inner : 2.5;      // 「右手が」と「おもーい」の間
    var repeatGap = opts.repeatGap != null ? opts.repeatGap : 5; // 1回目と2回目の間
    var after = opts.after != null ? opts.after : 10;       // 次の言葉かけに進むまで
    var display = subject.display + 'が、' + feeling.display;
    var subjectSpeech = subject.speech + 'が';
    return [
      { phase: phase, text: display, speak: subjectSpeech, voice: VOICE_FEELING, silence: inner },
      { phase: phase, text: display, speak: feeling.speech, voice: VOICE_FEELING, silence: repeatGap },
      { phase: phase, text: display, speak: subjectSpeech, voice: VOICE_FEELING, silence: inner },
      { phase: phase, text: display, speak: feeling.speech, voice: VOICE_FEELING, silence: after }
    ];
  }

  function scaleOpts(base, scale) {
    return {
      inner: Math.round(base.inner * scale * 10) / 10,
      repeatGap: Math.round(base.repeatGap * scale * 10) / 10,
      after: Math.round(base.after * scale * 10) / 10
    };
  }

  function buildHeavyEach(scale) {
    var o = scaleOpts({ inner: 2.5, repeatGap: 5, after: 10 }, scale);
    return [].concat(
      feelingCue('重感', HAND_R, HEAVY, o),
      feelingCue('重感', HAND_L, HEAVY, o),
      feelingCue('重感', FOOT_R, HEAVY, o),
      feelingCue('重感', FOOT_L, HEAVY, o)
    );
  }
  function buildHeavyAll(scale) {
    return feelingCue('重感', HAND_FOOT_BOTH, HEAVY, scaleOpts({ inner: 2.5, repeatGap: 5, after: 14 }, scale));
  }
  function buildWarmEach(scale) {
    var o = scaleOpts({ inner: 2.5, repeatGap: 5, after: 10 }, scale);
    return [].concat(
      feelingCue('温感', HAND_R, WARM, o),
      feelingCue('温感', HAND_L, WARM, o),
      feelingCue('温感', FOOT_R, WARM, o),
      feelingCue('温感', FOOT_L, WARM, o)
    );
  }
  function buildWarmAll(scale) {
    return feelingCue('温感', HAND_FOOT_BOTH, WARM, scaleOpts({ inner: 2.5, repeatGap: 5, after: 14 }, scale));
  }

  var PHASES = {
    intro: [
      { phase: '準備', text: '楽な姿勢を取りましょう。椅子に深く座るか、仰向けに横になってください。', silence: 6 },
      { phase: '準備', text: '目を閉じて、身体の力を抜いてください。', silence: 8 },
      { phase: '準備', text: 'それでは、自律訓練法を始めます。', silence: 4 },
      { phase: '準備', text: '気持ちが、とても落ち着いています。', silence: 10 }
    ],
    breathing: [
      { phase: '自然な呼吸', text: '呼吸が、とても楽になっています。', silence: 12 },
      { phase: '自然な呼吸', text: '自然に、ゆったりと呼吸しています。', silence: 12 }
    ],
    cancellation: [
      { phase: '消去動作', text: 'それでは、終わりにしましょう。消去動作を行います。', silence: 2 },
      { phase: '消去動作', text: '両手を、ぎゅっと強く握ってください。', silence: 4 },
      { phase: '消去動作', text: '手を、曲げたり伸ばしたりしてください。', silence: 5 },
      { phase: '消去動作', text: '大きく、伸びをしてください。', silence: 5 },
      { phase: '消去動作', text: '深呼吸を、一回してください。', silence: 5 },
      { phase: '消去動作', text: 'ゆっくりと、目を開けてください。', silence: 3 },
      { phase: '消去動作', text: 'これで、自律訓練法を終わります。お疲れ様でした。', silence: 1 }
    ]
  };

  function buildScript(minutes) {
    // コースが長いほど、重感・温感の沈黙(間)を長くする
    var scale = minutes === 5 ? 1 : (minutes === 10 ? 1.25 : 1.5);
    var script = [];
    script = script.concat(PHASES.intro);

    if (minutes === 5) {
      script = script.concat(buildHeavyAll(scale));
      script = script.concat(buildWarmAll(scale));
      script = script.concat(PHASES.breathing.slice(0, 1));
    } else if (minutes === 10) {
      script = script.concat(buildHeavyEach(scale), buildHeavyAll(scale));
      script = script.concat(buildWarmEach(scale), buildWarmAll(scale));
      script = script.concat(PHASES.breathing);
    } else {
      // 15分: 重感・温感を2巡する
      script = script.concat(buildHeavyEach(scale), buildHeavyAll(scale));
      script = script.concat(buildHeavyEach(scale), buildHeavyAll(scale));
      script = script.concat(buildWarmEach(scale), buildWarmAll(scale));
      script = script.concat(buildWarmEach(scale), buildWarmAll(scale));
      script = script.concat(PHASES.breathing, PHASES.breathing);
    }

    script = script.concat(PHASES.cancellation);
    return script;
  }

  // ---- 状態管理 ----
  var selectedMinutes = 10;
  var script = [];
  var currentIndex = 0;
  var isRunning = false;
  var isPaused = false;
  var elapsedSeconds = 0;
  var timerInterval = null;
  var silenceTimeoutId = null;

  var courseButtons = document.querySelectorAll('.course-btn');
  var startBtn = document.getElementById('startBtn');
  var toggleBtn = document.getElementById('toggleBtn');
  var endBtn = document.getElementById('endBtn');
  var phaseLabel = document.getElementById('phaseLabel');
  var phraseText = document.getElementById('phraseText');
  var timeDisplay = document.getElementById('timeDisplay');
  var timeTarget = document.getElementById('timeTarget');

  courseButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (isRunning) return;
      selectedMinutes = parseInt(btn.getAttribute('data-min'), 10);
      courseButtons.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      timeTarget.textContent = '目安: ' + selectedMinutes + '分';
    });
  });

  function formatTime(totalSeconds) {
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function tick() {
    elapsedSeconds += 1;
    timeDisplay.textContent = formatTime(elapsedSeconds);
  }

  function speakSegment(i) {
    if (!isRunning) return;
    if (i >= script.length) {
      finishSession();
      return;
    }
    currentIndex = i;
    var seg = script[i];
    phaseLabel.textContent = seg.phase;
    phraseText.textContent = seg.text;

    if (!synth) {
      // 音声合成が使えない場合は、テキスト表示だけで進める
      silenceTimeoutId = setTimeout(function () {
        speakSegment(i + 1);
      }, (seg.silence || 1) * 1000);
      return;
    }

    var voiceProfile = seg.voice || VOICE_BASE;
    var utter = new SpeechSynthesisUtterance(seg.speak || seg.text);
    utter.lang = 'ja-JP';
    utter.rate = voiceProfile.rate;
    utter.pitch = voiceProfile.pitch;
    utter.volume = 1.0;
    if (selectedVoice) utter.voice = selectedVoice;

    utter.onend = function () {
      if (!isRunning || isPaused) return;
      silenceTimeoutId = setTimeout(function () {
        if (!isRunning || isPaused) return;
        speakSegment(i + 1);
      }, (seg.silence || 0) * 1000);
    };
    utter.onerror = function () {
      if (!isRunning || isPaused) return;
      silenceTimeoutId = setTimeout(function () {
        if (!isRunning || isPaused) return;
        speakSegment(i + 1);
      }, (seg.silence || 0) * 1000);
    };

    synth.speak(utter);
  }

  function finishSession() {
    isRunning = false;
    isPaused = false;
    clearInterval(timerInterval);
    startBtn.disabled = false;
    toggleBtn.disabled = true;
    toggleBtn.textContent = '一時停止';
    endBtn.disabled = true;
    courseButtons.forEach(function (b) { b.disabled = false; });
    phaseLabel.textContent = '終了しました';
  }

  function startSession() {
    if (isRunning) return;
    script = buildScript(selectedMinutes);
    currentIndex = 0;
    elapsedSeconds = 0;
    isRunning = true;
    isPaused = false;

    timeDisplay.textContent = '00:00';
    startBtn.disabled = true;
    toggleBtn.disabled = false;
    toggleBtn.textContent = '一時停止';
    endBtn.disabled = false;
    courseButtons.forEach(function (b) { b.disabled = true; });

    if (synth) synth.cancel();
    timerInterval = setInterval(tick, 1000);
    speakSegment(0);
  }

  function pauseSession() {
    if (!isRunning || isPaused) return;
    isPaused = true;
    if (synth) synth.cancel();
    clearTimeout(silenceTimeoutId);
    clearInterval(timerInterval);
    toggleBtn.textContent = '再開';
    phaseLabel.textContent = '一時停止中';
  }

  function resumeSession() {
    if (!isRunning || !isPaused) return;
    isPaused = false;
    toggleBtn.textContent = '一時停止';
    timerInterval = setInterval(tick, 1000);
    speakSegment(currentIndex);
  }

  function endSession() {
    if (!isRunning) return;
    isRunning = false;
    isPaused = false;
    if (synth) synth.cancel();
    clearTimeout(silenceTimeoutId);
    clearInterval(timerInterval);

    startBtn.disabled = false;
    toggleBtn.disabled = true;
    toggleBtn.textContent = '一時停止';
    endBtn.disabled = true;
    courseButtons.forEach(function (b) { b.disabled = false; });

    phaseLabel.textContent = '終了しました';
    phraseText.textContent = ' ';
  }

  startBtn.addEventListener('click', startSession);
  endBtn.addEventListener('click', endSession);
  toggleBtn.addEventListener('click', function () {
    if (isPaused) {
      resumeSession();
    } else {
      pauseSession();
    }
  });

  // iOS Safariはタブを閉じたり画面を切り替えると音声合成が止まることがあるため、
  // 復帰時に読み上げが止まっていたら再開を試みる
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && isRunning && !isPaused && synth) {
      if (!synth.speaking && !silenceTimeoutId) {
        speakSegment(currentIndex);
      }
    }
  });
})();
</script>
</body>
</html>
